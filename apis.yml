aid: frec
name: Frec
description: >-
  Frec is a San Francisco fintech offering tax-aware, automated direct indexing
  for retail investors. Its products — Classic Direct Indexing, Long Short Direct
  Indexing, Diversify, Trade, Treasury cash management, and a Portfolio Line of
  Credit — replicate market indices with individual stocks while running
  automated tax-loss harvesting to minimize capital gains taxes at fees starting
  around 0.09%. Frec is an SEC-registered investment adviser and SIPC member
  managing over $1.25B in assets, founded by Mo Al Adham and backed by Greylock.
  The company ships a consumer investing app and website but does not currently
  expose a public developer API, so this profile is identity- and
  security-posture-only.
